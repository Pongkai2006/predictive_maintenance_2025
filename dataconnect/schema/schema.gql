type User @table {
  displayName: String!
  createdAt: Timestamp!
  email: String
  photoUrl: String
}

type Entry @table {
  user: User!
  entryDate: Date!
  content: String!
  privacyStatus: String!
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

type Category @table {
  user: User!
  name: String!
  createdAt: Timestamp!
  description: String
}

type EntryCategory @table(key: ["entry", "category"]) {
  entry: Entry!
  category: Category!
}

type Photo @table {
  entry: Entry!
  url: String!
  createdAt: Timestamp!
  caption: String
}

type Friendship @table(key: ["requester", "recipient"]) {
  requester: User!
  recipient: User!
  status: String!
  createdAt: Timestamp!
}